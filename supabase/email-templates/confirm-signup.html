<!--
  Paste into: Supabase Dashboard → Authentication → Email Templates → Confirm signup
  Variables used: {{ .ConfirmationURL }} — Supabase fills this in automatically.
-->
<div style="background:#f6f6fa;padding:40px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:16px;overflow:hidden;border:1px solid #e8e8ee;">
    <tr>
      <td style="padding:32px 32px 0 32px;">
        <table role="presentation">
          <tr>
            <td style="vertical-align:middle;">
              <div style="width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#5b5bd6,#894fd0);text-align:center;line-height:32px;">
                <span style="color:#ffffff;font-size:16px;">▤</span>
              </div>
            </td>
            <td style="padding-left:10px;vertical-align:middle;">
              <span style="font-size:16px;font-weight:600;color:#16161a;">Invoice</span><span style="font-size:16px;font-weight:600;color:#5b5bd6;">Flow</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>
    <tr>
      <td style="padding:28px 32px 8px 32px;">
        <h1 style="margin:0;font-size:20px;font-weight:600;color:#16161a;">Confirm your email</h1>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 24px 32px;">
        <p style="margin:0;font-size:15px;line-height:1.6;color:#5c5c6a;">
          Click below to confirm your address and activate your InvoiceFlow account.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 32px 32px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#5b5bd6;color:#ffffff;text-decoration:none;font-size:14px;font-weight:600;padding:12px 24px;border-radius:8px;">
          Confirm email address
        </a>
      </td>
    </tr>
    <tr>
      <td style="padding:0 32px 32px 32px;border-top:1px solid #e8e8ee;">
        <p style="margin:20px 0 0 0;font-size:12px;line-height:1.6;color:#8a8a98;">
          If you didn't create an InvoiceFlow account, you can safely ignore this email.
        </p>
      </td>
    </tr>
  </table>
</div>
